name: Multi integration gate
on:
  workflow_dispatch:
  push:
    branches: [multi-character]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: pawtest
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Create non-bypass test role
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d pawtest -v ON_ERROR_STOP=1 -c "CREATE ROLE pawtest LOGIN PASSWORD 'local-test-only' NOSUPERUSER NOBYPASSRLS; GRANT CREATE ON DATABASE pawtest TO pawtest; GRANT USAGE, CREATE ON SCHEMA public TO pawtest;"
      - name: Run tests including real RLS
        env:
          PAWWAKE_TEST_DATABASE_URL: postgresql://pawtest:local-test-only@localhost:5432/pawtest
        run: python -m unittest discover -s tests -v
      - run: docker build -t pawwake-multi:test .
      - name: Start disposable Docker gateway
        run: |
          docker run -d --name pawwake-smoke --network host \
            -e DATABASE_URL=postgresql://pawtest:local-test-only@127.0.0.1:5432/pawtest \
            -e DATABASE_ENABLED=true -e MEMORY_ENABLED=true \
            -e MULTI_CHARACTER_ENABLED=true -e MULTI_RLS_ENABLED=true \
            -e GATEWAY_SECRET=ci-only-gateway-secret \
            -e DASHBOARD_PASSWORD=ci-only-dashboard-password \
            -e SESSION_SECRET=ci-only-session-secret-at-least-32-characters \
            pawwake-multi:test
          python scripts/multi_smoke.py
      - name: Collect startup logs and clean up
        if: always()
        run: |
          if docker inspect pawwake-smoke >/dev/null 2>&1; then
            docker logs pawwake-smoke
            docker rm -f pawwake-smoke
          fi
