<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物管理</title><style>body{font:16px system-ui;background:#fff5f8;color:#493440;max-width:850px;margin:24px auto;padding:16px}section{background:white;border:1px solid #ecd5df;border-radius:12px;padding:20px;margin:16px 0}input,textarea,select,button{font:inherit;padding:10px;margin:6px 0;max-width:100%;box-sizing:border-box}input,textarea,select{width:100%}button{background:#f6dce7;border:1px solid #dcb6c7;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style><a href="/dashboard">返回原版后台</a><h1>多人物管理</h1><p>实验版 · 人物数据独立于原版全局记忆。</p><p id="status" role="status"></p><section><label>选择人物<select id="people"></select></label><button id="new">新建人物</button><label>名称<input id="name" maxlength="120"></label><label>独立 System Prompt<textarea id="prompt" rows="8" maxlength="50000"></textarea></label><button id="save">保存</button><button id="rotate">重置专属密钥（旧密钥全部失效）</button><p>新密钥仅显示一次，请妥善保存。</p><input id="key" readonly autocomplete="off" aria-label="新密钥"><button id="copy">复制密钥</button></section><section><h2>人物模型与记忆设置</h2><p>留空继承全局配置。先保存人物，再编辑设置。支持 chat_model、memory_model、embedding_model、prompt_mode、temperature、max_tokens、memory_enabled、extraction_enabled、history_enabled。</p><textarea id="overrides" rows="8" placeholder=' {"chat_model":"模型名称","prompt_mode":"merge"} '></textarea><button id="saveSettings">保存独立设置</button></section><section><h2>记忆管理与迁移</h2><p>核心记忆不可编辑或归档。备份包含私人聊天，请安全保存。导入仅追加记忆，不恢复人设或对话。</p><textarea id="manualMemory" rows="3" placeholder="记忆内容"></textarea><select id="memoryLayer"><option value="3">L3 原始碎片</option><option value="2">L2 事件</option><option value="1">L1 核心</option></select><button id="addMemory">新增记忆</button><button id="backup">导出人物 JSON</button><input id="importFile" type="file" accept=".json,application/json"><button id="importMemory">预览并导入记忆</button></section><section><h2>最近记忆与对话（各100条）</h2><button id="refresh">刷新</button><div id="details"></div></section><script src="/static/js/characters.js" defer></script></html>
